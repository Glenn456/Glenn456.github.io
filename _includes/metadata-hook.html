<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════
   SIEM CONSOLE — SIDEBAR
   ═══════════════════════════════════════════ */
:root{
  --siem-base:#06080D; --siem-surf:#0B1119; --siem-line:rgba(255,255,255,.08);
  --siem-violet:#7C5CFF; --siem-mint:#00F0B5; --siem-rose:#FF4D6D; --siem-amber:#FFB020;
  --siem-steel:#8A97AB; --siem-ice:#DCE4F0;
  --siem-d:'Chakra Petch',system-ui,sans-serif;
  --siem-m:'IBM Plex Mono',ui-monospace,monospace;
}

#sidebar{
  background:var(--siem-base) !important;
  border-right:1px solid var(--siem-line);
  overflow:hidden;
}
#sidebar::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(124,92,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(124,92,255,.045) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:linear-gradient(180deg,#000 0%,#000 62%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 62%,transparent 100%);
}
#sidebar::after{
  content:'';position:absolute;left:0;right:0;height:120px;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(124,92,255,.07),transparent);
  animation:siemScan 7s linear infinite;
}
@keyframes siemScan{0%{top:-120px}100%{top:100%}}
#sidebar > *{position:relative;z-index:1}

/* ── status strip ── */
.siem-strip{
  display:flex;align-items:center;gap:7px;
  width:100%;padding:9px 14px;
  border-bottom:1px solid var(--siem-line);
  background:rgba(124,92,255,.06);
  font-family:var(--siem-m);font-size:9px;letter-spacing:.14em;
  color:var(--siem-steel);text-transform:uppercase;
}
.siem-blip{
  width:6px;height:6px;border-radius:50%;background:var(--siem-mint);flex-shrink:0;
  animation:siemBeat 2.4s ease-in-out infinite;
}
@keyframes siemBeat{0%,100%{box-shadow:0 0 0 0 rgba(0,240,181,.55)}50%{box-shadow:0 0 0 6px rgba(0,240,181,0)}}
.siem-strip .siem-t{margin-left:auto;color:var(--siem-mint)}

/* ── profile ── */
#sidebar .profile-wrapper{padding-top:14px !important}
#sidebar #avatar{
  border:1px solid rgba(124,92,255,.4) !important;
  box-shadow:0 0 0 3px rgba(124,92,255,.09),0 10px 30px -12px rgba(124,92,255,.5);
  transition:box-shadow .3s;
}
#sidebar #avatar:hover{box-shadow:0 0 0 5px rgba(124,92,255,.16),0 12px 34px -10px rgba(124,92,255,.7)}
#sidebar .site-title{font-family:var(--siem-d) !important;font-weight:700 !important;letter-spacing:.01em}
#sidebar .site-title a{color:var(--siem-ice) !important}
#sidebar .site-subtitle{
  font-family:var(--siem-m) !important;font-style:normal !important;
  font-size:10.5px !important;letter-spacing:.06em;
  color:var(--siem-steel) !important;line-height:1.6;
}

/* ── nav rows ── */
#sidebar ul.nav{width:100%;padding:0 8px}
#sidebar .nav-item{margin-bottom:2px}
#sidebar .nav-link{
  font-family:var(--siem-m) !important;
  font-size:11px !important;letter-spacing:.1em;
  color:var(--siem-steel) !important;
  border-radius:7px !important;
  padding:9px 12px !important;
  position:relative;
  border-left:2px solid transparent;
  transition:background .18s,color .18s,border-color .18s;
}
#sidebar .nav-link::before{
  content:'';position:absolute;left:-2px;top:50%;transform:translateY(-50%);
  width:2px;height:0;background:var(--siem-violet);transition:height .22s;
}
#sidebar .nav-link:hover{
  background:rgba(124,92,255,.08) !important;
  color:var(--siem-ice) !important;
}
#sidebar .nav-link:hover::before{height:58%}
#sidebar .nav-link i{
  color:var(--siem-steel) !important;
  width:18px;transition:color .18s;
}
#sidebar .nav-link:hover i{color:var(--siem-violet) !important}
#sidebar .nav-item.active .nav-link{
  background:linear-gradient(90deg,rgba(124,92,255,.18),rgba(124,92,255,.04)) !important;
  color:#fff !important;
  border-radius:7px !important;
}
#sidebar .nav-item.active .nav-link::before{height:74%;background:var(--siem-mint)}
#sidebar .nav-item.active .nav-link i{color:var(--siem-mint) !important}
#sidebar .nav-item.active .nav-link span{font-weight:600}

/* ── throughput meter ── */
.siem-meter{width:100%;padding:0 14px 4px}
.siem-meter-l{
  display:flex;justify-content:space-between;
  font-family:var(--siem-m);font-size:8.5px;letter-spacing:.14em;
  color:var(--siem-steel);text-transform:uppercase;margin-bottom:6px;
}
.siem-meter-l b{color:var(--siem-violet);font-weight:500}
.siem-bars{display:flex;gap:2px;align-items:flex-end;height:22px}
.siem-bars i{
  flex:1;background:linear-gradient(180deg,var(--siem-violet),rgba(124,92,255,.2));
  border-radius:1px;transition:height .45s ease;min-height:2px;
}

/* ── bottom ── */
#sidebar .sidebar-bottom{border-top:1px solid var(--siem-line);padding-top:12px !important}
#sidebar .sidebar-bottom a,#sidebar .sidebar-bottom i{color:var(--siem-steel) !important;transition:color .18s}
#sidebar .sidebar-bottom a:hover,#sidebar .sidebar-bottom a:hover i{color:var(--siem-violet) !important}
#sidebar .sidebar-bottom .mode-toggle{color:var(--siem-steel) !important}

/* ═══════════════════════════════════════════
   TELEMETRY PANEL
   ═══════════════════════════════════════════ */
#tel-btn{
  position:fixed;z-index:9999;bottom:26px;right:26px;
  width:48px;height:48px;border-radius:12px;
  background:var(--siem-surf);
  border:1px solid rgba(124,92,255,.35);
  color:var(--siem-violet);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.6),0 0 0 0 rgba(124,92,255,.4);
  transition:all .25s;
}
#tel-btn:hover{border-color:var(--siem-violet);box-shadow:0 10px 34px -6px rgba(124,92,255,.45);transform:translateY(-2px)}
#tel-btn svg{width:20px;height:20px}
#tel-btn .tel-n{
  position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 4px;
  border-radius:10px;background:var(--siem-violet);color:#fff;
  font-family:var(--siem-m);font-size:9.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(124,92,255,.6);
}

#tel-panel{
  position:fixed;z-index:9998;right:26px;bottom:86px;width:318px;
  background:var(--siem-base);
  border:1px solid rgba(124,92,255,.24);
  border-radius:13px;overflow:hidden;
  box-shadow:0 24px 60px -18px rgba(0,0,0,.8),0 0 40px -20px rgba(124,92,255,.4);
  transform:scale(.9) translateY(16px);opacity:0;pointer-events:none;
  transition:all .26s cubic-bezier(.34,1.4,.64,1);
  transform-origin:bottom right;
  font-family:var(--siem-d);
}
#tel-panel.on{transform:scale(1) translateY(0);opacity:1;pointer-events:all}

.tel-head{
  display:flex;align-items:center;gap:8px;padding:11px 14px;
  background:rgba(124,92,255,.09);border-bottom:1px solid var(--siem-line);
}
.tel-head .tel-h{
  font-family:var(--siem-m);font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--siem-ice);
}
.tel-head .tel-ts{
  margin-left:auto;font-family:var(--siem-m);font-size:9.5px;color:var(--siem-mint);
}

.tel-tabs{display:flex;border-bottom:1px solid var(--siem-line)}
.tel-tab{
  flex:1;font-family:var(--siem-m);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;padding:9px 6px;cursor:pointer;
  color:var(--siem-steel);text-align:center;
  border-bottom:2px solid transparent;transition:all .18s;
}
.tel-tab:hover{color:var(--siem-ice)}
.tel-tab.on{color:var(--siem-violet);border-bottom-color:var(--siem-violet);background:rgba(124,92,255,.06)}

.tel-body{max-height:308px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(124,92,255,.35) transparent}
.tel-body::-webkit-scrollbar{width:4px}
.tel-body::-webkit-scrollbar-thumb{background:rgba(124,92,255,.35);border-radius:2px}
.tel-pane{display:none;padding:10px 0}
.tel-pane.on{display:block}

/* top-N volume rows */
.tel-row{
  display:block;text-decoration:none;padding:7px 14px;
  transition:background .15s;position:relative;
}
.tel-row:hover{background:rgba(124,92,255,.07)}
.tel-rt{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.tel-rk{font-family:var(--siem-m);font-size:9px;color:var(--siem-steel);min-width:16px}
.tel-nm{font-family:var(--siem-m);font-size:11px;color:var(--siem-ice);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tel-row:hover .tel-nm{color:var(--siem-violet)}
.tel-ct{font-family:var(--siem-m);font-size:10px;color:var(--siem-mint)}
.tel-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.05);overflow:hidden;margin-left:24px}
.tel-bar i{display:block;height:100%;border-radius:2px;width:0;transition:width .7s cubic-bezier(.2,.8,.3,1)}
.tel-b1 i{background:linear-gradient(90deg,var(--siem-rose),var(--siem-amber))}
.tel-b2 i{background:linear-gradient(90deg,var(--siem-amber),var(--siem-violet))}
.tel-b3 i{background:linear-gradient(90deg,var(--siem-violet),rgba(124,92,255,.35))}

/* event stream */
.tel-ev{
  display:block;text-decoration:none;padding:9px 14px;
  border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s;
}
.tel-ev:last-child{border-bottom:none}
.tel-ev:hover{background:rgba(124,92,255,.07)}
.tel-em{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.tel-dot{width:5px;height:5px;border-radius:50%;background:var(--siem-mint);flex-shrink:0}
.tel-ed{font-family:var(--siem-m);font-size:9px;color:var(--siem-steel);letter-spacing:.06em}
.tel-et{
  font-family:var(--siem-m);font-size:10.5px;color:var(--siem-ice);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tel-ev:hover .tel-et{color:var(--siem-violet)}
.tel-tg{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.tel-tg span{
  font-family:var(--siem-m);font-size:8.5px;padding:1px 6px;border-radius:3px;
  background:rgba(124,92,255,.12);color:var(--siem-steel);
}

.tel-foot{
  display:flex;justify-content:space-between;padding:9px 14px;
  border-top:1px solid var(--siem-line);background:rgba(124,92,255,.05);
  font-family:var(--siem-m);font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--siem-steel);
}
.tel-foot b{color:var(--siem-mint);font-weight:500}

@media(max-width:576px){
  #tel-panel{width:calc(100vw - 36px);right:18px;bottom:78px}
  #tel-btn{right:18px;bottom:18px;width:44px;height:44px}
}
@media(prefers-reduced-motion:reduce){
  #sidebar::after,.siem-blip{animation:none}
  .tel-bar i,.siem-bars i{transition:none}
}

/* ═══════════════════════════════════════════
   SIEM CONSOLE — RIGHT PANEL
   ═══════════════════════════════════════════ */
#panel-wrapper{
  font-family:var(--siem-d);
}
#panel-wrapper .access{
  position:relative;
  border:1px solid var(--siem-line);
  border-radius:11px;
  background:var(--siem-base);
  padding:14px 13px 12px;
  overflow:hidden;
}
#panel-wrapper .access::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(124,92,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(124,92,255,.04) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(180deg,#000,transparent 88%);
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 88%);
}
#panel-wrapper .access > *{position:relative;z-index:1}

/* headings */
#panel-wrapper .panel-heading,
html #panel-wrapper h2.panel-heading{
  font-family:var(--siem-m) !important;
  font-size:9.5px !important;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--siem-steel) !important;
  display:flex;align-items:center;gap:7px;
  padding-bottom:9px !important;
  margin-bottom:0 !important;
  border-bottom:1px solid var(--siem-line);
  font-weight:500 !important;
}
#panel-wrapper .panel-heading::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:var(--siem-mint);flex-shrink:0;
  animation:siemBeat 2.6s ease-in-out infinite;
}
#panel-wrapper section + section{margin-top:20px}

/* sync line */
.siem-sync{
  display:flex;justify-content:space-between;
  font-family:var(--siem-m);font-size:8px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--siem-steel);opacity:.55;
  padding:7px 0 3px;
}
.siem-sync b{color:var(--siem-mint);font-weight:500}

/* recently updated -> event rows */
#access-lastmod ul{
  counter-reset:siemrow;
  margin:0 !important;padding:0 !important;
}
#access-lastmod ul li{
  counter-increment:siemrow;
  position:relative;
  padding:8px 0 8px 26px !important;
  border-bottom:1px solid rgba(255,255,255,.045);
  transition:background .16s;
}
#access-lastmod ul li:last-child{border-bottom:none}
#access-lastmod ul li::before{
  content:counter(siemrow,decimal-leading-zero);
  position:absolute;left:0;top:9px;
  font-family:var(--siem-m);font-size:8.5px;
  color:var(--siem-violet);opacity:.75;letter-spacing:.05em;
}
#access-lastmod ul li::after{
  content:'';position:absolute;left:-13px;top:0;bottom:0;width:2px;
  background:var(--siem-violet);transform:scaleY(0);transform-origin:center;
  transition:transform .2s;
}
#access-lastmod ul li:hover{background:rgba(124,92,255,.06)}
#access-lastmod ul li:hover::after{transform:scaleY(.7)}
#access-lastmod ul li a,
html #panel-wrapper #access-lastmod ul li a{
  font-family:var(--siem-m) !important;
  font-size:10.5px !important;line-height:1.5 !important;
  color:var(--siem-steel) !important;
  white-space:normal !important;
  display:block;
  transition:color .16s;
}
#access-lastmod ul li:hover a{color:var(--siem-ice) !important}

/* trending tags -> chips */
#access-tags .d-flex{margin-top:11px !important;gap:5px}
#access-tags .post-tag,
html #panel-wrapper #access-tags a.post-tag{
  font-family:var(--siem-m) !important;
  font-size:9.5px !important;letter-spacing:.04em;
  padding:4px 9px !important;
  border-radius:4px !important;
  background:rgba(124,92,255,.08) !important;
  border:1px solid rgba(124,92,255,.2) !important;
  color:var(--siem-steel) !important;
  margin:0 !important;
  transition:all .16s;
  position:relative;
}
#access-tags .post-tag::before{
  content:'#';opacity:.4;margin-right:2px;
}
#access-tags .post-tag:hover{
  background:rgba(124,92,255,.2) !important;
  border-color:var(--siem-violet) !important;
  color:#fff !important;
  transform:translateY(-1px);
}

/* table of contents */
#toc-wrapper{
  border:1px solid var(--siem-line);
  border-radius:11px;background:var(--siem-base);
  padding:13px !important;
}
#toc-wrapper .panel-heading{border-bottom:1px solid var(--siem-line)}
#toc-wrapper .toc-link,
#toc-wrapper .toc a{
  font-family:var(--siem-m) !important;
  font-size:10px !important;
  color:var(--siem-steel) !important;
  border-left:2px solid transparent;
  padding-left:9px !important;
  transition:all .16s;
}
#toc-wrapper .toc-link:hover,
#toc-wrapper .toc a:hover{color:var(--siem-violet) !important;border-left-color:rgba(124,92,255,.4)}
#toc-wrapper .is-active-link,
#toc-wrapper .toc .is-active-link{
  color:var(--siem-mint) !important;
  border-left-color:var(--siem-mint) !important;
  font-weight:500 !important;
}
#toc-wrapper .is-active-link::before{display:none !important}

/* ═══════════ LIVE STREAM + CONTACT ═══════════ */
.siem-stream-wrap{
  position:relative;margin-top:20px;
  border-top:1px solid var(--siem-line);padding-top:12px;
}
.siem-sh{
  font-family:var(--siem-m);font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--siem-steel);
  display:flex;align-items:center;gap:7px;padding-bottom:9px;
  border-bottom:1px solid var(--siem-line);
}
.siem-sh::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:var(--siem-rose);flex-shrink:0;
  animation:siemBeat 1.7s ease-in-out infinite;
}
.siem-sh .siem-eps{margin-left:auto;color:var(--siem-mint);letter-spacing:0}

.siem-stream{
  position:relative;height:186px;overflow:hidden;margin-top:6px;
  mask-image:linear-gradient(180deg,transparent,#000 12%,#000 84%,transparent);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 12%,#000 84%,transparent);
}
.siem-track{display:flex;flex-direction:column;will-change:transform}
.siem-stream:hover .siem-track{animation-play-state:paused}

.siem-ev{
  display:block;text-decoration:none;padding:7px 0 7px 20px;
  position:relative;border-bottom:1px solid rgba(255,255,255,.035);
  transition:background .15s;
}
.siem-ev:hover{background:rgba(124,92,255,.07)}
.siem-ev::before{
  content:'';position:absolute;left:6px;top:12px;
  width:5px;height:5px;border-radius:50%;
}
.siem-ev.s1::before{background:var(--siem-rose);box-shadow:0 0 6px rgba(255,77,109,.8)}
.siem-ev.s2::before{background:var(--siem-amber);box-shadow:0 0 6px rgba(255,176,32,.7)}
.siem-ev.s3::before{background:var(--siem-mint);box-shadow:0 0 6px rgba(0,240,181,.6)}
.siem-ev-m{
  display:flex;gap:7px;align-items:center;
  font-family:var(--siem-m);font-size:8px;letter-spacing:.1em;
  color:var(--siem-steel);opacity:.7;margin-bottom:3px;text-transform:uppercase;
}
.siem-ev-t{
  font-family:var(--siem-m);font-size:10px;line-height:1.5;
  color:var(--siem-steel);transition:color .15s;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.siem-ev:hover .siem-ev-t{color:var(--siem-violet)}

@keyframes siemRoll{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}

/* contact */
.siem-contact{
  margin-top:20px;border-top:1px solid var(--siem-line);padding-top:12px;
}
.siem-ch{
  font-family:var(--siem-m);font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--siem-steel);
  display:flex;align-items:center;gap:7px;padding-bottom:10px;
}
.siem-ch::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:var(--siem-mint);flex-shrink:0;
  animation:siemBeat 2.6s ease-in-out infinite;
}
.siem-cr{
  display:flex;align-items:center;gap:9px;
  padding:7px 0;text-decoration:none;
  border-bottom:1px solid rgba(255,255,255,.035);
  transition:all .16s;
}
.siem-cr:last-of-type{border-bottom:none}
.siem-cr:hover{padding-left:4px}
.siem-ck{
  font-family:var(--siem-m);font-size:8px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--siem-steel);opacity:.6;
  min-width:38px;flex-shrink:0;
}
.siem-cv{
  font-family:var(--siem-m);font-size:10px;color:var(--siem-steel);
  word-break:break-all;transition:color .16s;
}
.siem-cr:hover .siem-cv{color:var(--siem-violet)}
.siem-open{
  display:block;margin-top:11px;padding:8px;text-align:center;
  border:1px solid rgba(0,240,181,.3);border-radius:6px;
  background:rgba(0,240,181,.07);
  font-family:var(--siem-m);font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--siem-mint);
  text-decoration:none;transition:all .18s;
}
.siem-open:hover{background:rgba(0,240,181,.16);border-color:var(--siem-mint)}

/* ═══════════ NAV: cipher ═══════════ */
#sidebar .nav-link span{
  display:inline-block;
  font-variant-ligatures:none;
  font-feature-settings:"tnum";
}
#sidebar .nav-link.ciphering span{color:var(--siem-violet) !important;text-shadow:0 0 8px rgba(124,92,255,.5)}
#sidebar .nav-link::after{
  content:'';position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:0;height:1px;background:var(--siem-mint);

</style>

<script>
document.addEventListener('DOMContentLoaded', function(){

  var slow = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ══════ SIDEBAR: status strip + throughput ══════ */
  var sb = document.getElementById('sidebar');
  if(sb){
    var strip = document.createElement('div');
    strip.className = 'siem-strip';
    strip.innerHTML = '<span class="siem-blip"></span><span>console</span><span class="siem-t" id="siem-clock">--:--</span>';
    sb.insertBefore(strip, sb.firstChild);

    function clk(){
      var d = new Date(new Date().toLocaleString('en-US',{timeZone:'Africa/Nairobi'}));
      var p = function(n){return String(n).padStart(2,'0')};
      var el = document.getElementById('siem-clock');
      if(el) el.textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
    }
    clk(); setInterval(clk,1000);

    var nav = sb.querySelector('nav');
    if(nav){
      var meter = document.createElement('div');
      meter.className = 'siem-meter';
      meter.innerHTML = '<div class="siem-meter-l"><span>event throughput</span><b id="siem-eps">0</b></div>' +
                        '<div class="siem-bars" id="siem-bars"></div>';
      nav.parentNode.insertBefore(meter, nav.nextSibling);

      var bars = document.getElementById('siem-bars');
      var N = 22, vals = [];
      for(var i=0;i<N;i++){ vals.push(3+Math.random()*70); bars.appendChild(document.createElement('i')); }
      var els = bars.querySelectorAll('i');
      function paintBars(){
        for(var i=0;i<N;i++) els[i].style.height = vals[i]+'%';
        var eps = document.getElementById('siem-eps');
        if(eps) eps.textContent = (Math.round(vals[N-1]*14)+120)+'/s';
      }
      paintBars();
      if(!slow) setInterval(function(){
        vals.shift();
        var last = vals[vals.length-1] || 40;
        var next = last + (Math.random()*44 - 22);
        if(Math.random() < 0.09) next = 72 + Math.random()*26;
        vals.push(Math.max(4, Math.min(96, next)));
        paintBars();
      }, 1200);
    }
  }

  /* ══════ TELEMETRY PANEL ══════ */
  var tagData = [
    {% for tag in site.tags %}{ n: {{ tag[0] | jsonify }}, c: {{ tag[1].size }}, u: "/tags/{{ tag[0] | slugify }}/" }{% unless forloop.last %},{% endunless %}{% endfor %}
  ];
  var postData = [
    {% for post in site.posts limit:8 %}{
      t: {{ post.title | truncate: 58 | jsonify }},
      u: {{ post.url | jsonify }},
      d: {{ post.date | date: "%Y-%m-%d" | jsonify }},
      g: [{% for tag in post.tags limit:3 %}{{ tag | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}]
    }{% unless forloop.last %},{% endunless %}{% endfor %}
  ];

  var totalPosts = {{ site.posts.size }};

  var btn = document.createElement('button');
  btn.id = 'tel-btn';
  btn.title = 'Tag telemetry';
  btn.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M3 13h4l3-8 4 16 3-8h4"/></svg>' +
    '<span class="tel-n">' + tagData.length + '</span>';
  document.body.appendChild(btn);

  var sorted = tagData.slice().sort(function(a,b){ return b.c - a.c; });
  var max = sorted.length ? sorted[0].c : 1;

  var topHtml = sorted.slice(0,18).map(function(t,i){
    var band = i < 3 ? 'tel-b1' : (i < 8 ? 'tel-b2' : 'tel-b3');
    var pct = Math.max(6, Math.round(t.c / max * 100));
    return '<a class="tel-row" href="'+t.u+'">' +
             '<div class="tel-rt">' +
               '<span class="tel-rk">'+String(i+1).padStart(2,'0')+'</span>' +
               '<span class="tel-nm">'+t.n+'</span>' +
               '<span class="tel-ct">'+t.c+'</span>' +
             '</div>' +
             '<div class="tel-bar '+band+'"><i data-w="'+pct+'"></i></div>' +
           '</a>';
  }).join('');

  var evHtml = postData.map(function(p){
    var tags = p.g.map(function(g){ return '<span>'+g+'</span>' }).join('');
    return '<a class="tel-ev" href="'+p.u+'">' +
             '<div class="tel-em"><span class="tel-dot"></span><span class="tel-ed">'+p.d+'</span></div>' +
             '<div class="tel-et">'+p.t+'</div>' +
             '<div class="tel-tg">'+tags+'</div>' +
           '</a>';
  }).join('');

  var panel = document.createElement('div');
  panel.id = 'tel-panel';
  panel.innerHTML =
    '<div class="tel-head">' +
      '<span class="siem-blip"></span>' +
      '<span class="tel-h">telemetry</span>' +
      '<span class="tel-ts" id="tel-ts">--:--:--</span>' +
    '</div>' +
    '<div class="tel-tabs">' +
      '<div class="tel-tab on" data-p="0">top tags</div>' +
      '<div class="tel-tab" data-p="1">event stream</div>' +
    '</div>' +
    '<div class="tel-body">' +
      '<div class="tel-pane on" id="tel-p0">' + (topHtml || '<p style="padding:14px;color:#8A97AB;font-size:11px">no tags indexed</p>') + '</div>' +
      '<div class="tel-pane" id="tel-p1">' + (evHtml || '<p style="padding:14px;color:#8A97AB;font-size:11px">no events</p>') + '</div>' +
    '</div>' +
    '<div class="tel-foot"><span>indexed</span><span><b>' + totalPosts + '</b> posts / <b>' + tagData.length + '</b> tags</span></div>';
  document.body.appendChild(panel);

  function fillBars(){
    panel.querySelectorAll('.tel-bar i').forEach(function(el,i){
      setTimeout(function(){ el.style.width = el.dataset.w + '%'; }, slow ? 0 : i*38);
    });
  }

  function telClock(){
    var d = new Date();
    var p = function(n){return String(n).padStart(2,'0')};
    var el = document.getElementById('tel-ts');
    if(el) el.textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }
  telClock(); setInterval(telClock,1000);

  var filled = false;
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    panel.classList.toggle('on');
    if(panel.classList.contains('on') && !filled){ filled = true; fillBars(); }
  });

  panel.querySelectorAll('.tel-tab').forEach(function(t){
    t.addEventListener('click', function(){
      panel.querySelectorAll('.tel-tab').forEach(function(x){ x.classList.remove('on') });
      panel.querySelectorAll('.tel-pane').forEach(function(x){ x.classList.remove('on') });
      t.classList.add('on');
      document.getElementById('tel-p' + t.dataset.p).classList.add('on');
    });
  });

  document.addEventListener('click', function(e){
    if(panel.classList.contains('on') && !panel.contains(e.target) && !btn.contains(e.target)){
      panel.classList.remove('on');
    }
  });


  /* ══════ RIGHT PANEL: sync line ══════ */
  var lastmod = document.getElementById('access-lastmod');
  if(lastmod){
    var sync = document.createElement('div');
    sync.className = 'siem-sync';
    sync.innerHTML = '<span>last sync</span><b id="siem-sync-t">--:--:--</b>';
    var h = lastmod.querySelector('.panel-heading');
    if(h) h.parentNode.insertBefore(sync, h.nextSibling);

    function syncClk(){
      var d = new Date();
      var p = function(n){return String(n).padStart(2,'0')};
      var el = document.getElementById('siem-sync-t');
      if(el) el.textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
    }
    syncClk(); setInterval(syncClk,1000);
  }

  var tagsSec = document.getElementById('access-tags');
  if(tagsSec){
    var n = tagsSec.querySelectorAll('.post-tag').length;
    var meta = document.createElement('div');
    meta.className = 'siem-sync';
    meta.innerHTML = '<span>top by volume</span><b>' + n + ' active</b>';
    var th = tagsSec.querySelector('.panel-heading');
    if(th) th.parentNode.insertBefore(meta, th.nextSibling);
  }


  /* ══════ LIVE STREAM + CONTACT ══════ */
  var accessBox = document.querySelector('#panel-wrapper .access');
  if(accessBox && postData.length){

    /* ---- stream ---- */
    var wrap = document.createElement('div');
    wrap.className = 'siem-stream-wrap';
    wrap.innerHTML = '<div class="siem-sh">live stream<span class="siem-eps" id="siem-sps">0/min</span></div>' +
                     '<div class="siem-stream"><div class="siem-track" id="siem-track"></div></div>';
    accessBox.appendChild(wrap);

    function ago(ds){
      var d = new Date(ds + 'T09:00:00Z');
      var mins = Math.round((Date.now() - d.getTime()) / 60000);
      if(mins < 60) return mins + 'm ago';
      var h = Math.round(mins/60);
      if(h < 24) return h + 'h ago';
      var dd = Math.round(h/24);
      if(dd < 30) return dd + 'd ago';
      return Math.round(dd/30) + 'mo ago';
    }

    var sevs = ['s1','s2','s3'];
    function rowHtml(p, i){
      var sev = sevs[i % 3];
      var lbl = sev === 's1' ? 'HIGH' : (sev === 's2' ? 'MED' : 'INFO');
      return '<a class="siem-ev ' + sev + '" href="' + p.u + '">' +
               '<div class="siem-ev-m"><span>' + lbl + '</span><span>' + ago(p.d) + '</span></div>' +
               '<div class="siem-ev-t">' + p.t + '</div>' +
             '</a>';
    }

    var track = document.getElementById('siem-track');
    var rows = postData.map(rowHtml).join('');
    track.innerHTML = rows + rows;

    if(!slow){
      var dur = Math.max(26, postData.length * 5.2);
      track.style.animation = 'siemRoll ' + dur + 's linear infinite';
    }

    var sps = document.getElementById('siem-sps');
    function bumpSps(){
      if(sps) sps.textContent = (38 + Math.round(Math.random()*54)) + '/min';
    }
    bumpSps();
    if(!slow) setInterval(bumpSps, 2600);

    /* ---- contact ---- */
    var CONTACT = {
      email: 'ongaloglenn45@gmail.com',
      phone: '+254 745 530 525',
      loc:   'Nairobi, Kenya'
    };

    var cRows =
      '<a class="siem-cr" href="mailto:' + CONTACT.email + '">' +
        '<span class="siem-ck">mail</span><span class="siem-cv">' + CONTACT.email + '</span></a>';
    if(CONTACT.phone){
      cRows += '<a class="siem-cr" href="tel:' + CONTACT.phone.replace(/\s+/g,'') + '">' +
                 '<span class="siem-ck">tel</span><span class="siem-cv">' + CONTACT.phone + '</span></a>';
    }
    cRows += '<div class="siem-cr"><span class="siem-ck">loc</span><span class="siem-cv">' + CONTACT.loc + '</span></div>';

    var cbox = document.createElement('div');
    cbox.className = 'siem-contact';
    cbox.innerHTML = '<div class="siem-ch">contact</div>' + cRows +
                     '<a class="siem-open" href="/about/">status: open to work</a>';
    accessBox.appendChild(cbox);
  }


  /* ══════ NAV CIPHER ══════ */
  (function(){
    var GLY = '!<>-_\\/[]{}=+*^?#01ABCDEF$%&@';
    function scramble(el, done){
      var final = el.dataset.final || el.textContent.trim();
      el.dataset.final = final;
      var n = final.length, frame = 0;
      var q = [];
      for(var i=0;i<n;i++) q.push({c:final[i], s:(Math.random()*7)|0, e:((Math.random()*8)|0)+7});
      if(el._raf) cancelAnimationFrame(el._raf);
      (function step(){
        var out='', complete=0;
        for(var i=0;i<n;i++){
          var o=q[i];
          if(frame>=o.e){complete++; out+=o.c}
          else if(o.c===' '){out+=' '}
          else out += GLY[(Math.random()*GLY.length)|0];
        }
        el.textContent = out;
        if(complete<n){ frame++; el._raf = requestAnimationFrame(step); }
        else { el.textContent = final; done && done(); }
      })();
    }

    var links = document.querySelectorAll('#sidebar .nav-link');
    links.forEach(function(a, i){
      var sp = a.querySelector('span');
      if(!sp) return;
      sp.dataset.final = sp.textContent.trim();
      if(!slow) setTimeout(function(){ scramble(sp) }, 120 + i*85);
      a.addEventListener('mouseenter', function(){
        if(slow) return;
        a.classList.add('ciphering');
        scramble(sp, function(){ a.classList.remove('ciphering') });
      });
    });
  })();

  /* ══════ ARCHIVES: reveal ══════ */
  (function(){
    var arch = document.getElementById('archives');
    if(!arch || slow) return;
    var items = arch.querySelectorAll('li');
    if(!('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting) return;
        var el = e.target;
        el.style.transition = 'opacity .5s, transform .5s';
        el.style.opacity = '1';
        el.style.transform = 'none';
        io.unobserve(el);
      });
    }, {threshold:0, rootMargin:'0px 0px -30px 0px'});
    items.forEach(function(el, i){
      el.style.opacity = '0';
      el.style.transform = 'translateX(-14px)';
      el.style.transitionDelay = Math.min(i*28, 400) + 'ms';
      io.observe(el);
    });
  })();

  /* ══════ CATEGORIES: stagger ══════ */
  (function(){
    var cats = document.querySelectorAll('#categories .card');
    if(!cats.length || slow) return;
    if(!('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting) return;
        e.target.style.transition = 'opacity .55s, transform .55s';
        e.target.style.opacity = '1';
        e.target.style.transform = 'none';
        io.unobserve(e.target);
      });
    }, {threshold:.08});
    cats.forEach(function(el, i){
      el.style.opacity = '0';
      el.style.transform = 'translateY(16px)';
      el.style.transitionDelay = Math.min(i*70, 420) + 'ms';
      io.observe(el);
    });
  })();


  /* ══════ HOME: packet network + the six hats ══════ */
  (function(){
    var path = location.pathname.replace(/\/index\.html$/, '/');
    if(path !== '/' && path !== '') return;
    document.body.classList.add('cy-home');

    var cards = document.querySelectorAll('#post-list .card-wrapper, #post-list .card');
    if(cards.length && !slow && 'IntersectionObserver' in window){
      var cio = new IntersectionObserver(function(es){
        es.forEach(function(e){
          if(!e.isIntersecting) return;
          e.target.classList.add('up');
          cio.unobserve(e.target);
        });
      },{threshold:.05});
      cards.forEach(function(el,i){
        el.classList.add('cy-in');
        el.style.transitionDelay = Math.min(i*70,420)+'ms';
        cio.observe(el);
      });
    }

    if(slow) return;

    var cv = document.createElement('canvas');
    cv.id = 'cy-bg';
    document.body.insertBefore(cv, document.body.firstChild);
    var g = cv.getContext('2d');

    var W,H,GAP=74,cols,rows,nodes=[],packets=[],hats=[],sparks=[],vis=true,dpr;
    var bench={}, F=0, nextDuel=260;

    var HATS = [
      { n:'BLACK HAT',  hat:'#D8DCE6', body:'#0F1218', glow:'rgba(216,220,230,.45)',
        act:'strike', say:['no permission needed','exfiltrating...','0day, going once'] },
      { n:'WHITE HAT',  hat:'#FFFFFF', body:'#B9C4D4', glow:'rgba(255,255,255,.6)',
        act:'guard',  say:['authorised scope only','writing the report','patch it, then publish'] },
      { n:'GREY HAT',   hat:'#9AA6B5', body:'#454D5B', glow:'rgba(154,166,181,.5)',
        act:'shrug',  say:['no permission, no malice','found it, told them','somewhere in between'] },
      { n:'PURPLE HAT', hat:'#B07CFF', body:'#35205A', glow:'rgba(176,124,255,.6)',
        act:'spin',   say:['red plus blue','I attack my own defences','purple team'] },
      { n:'GREEN HAT',  hat:'#3DD68C', body:'#143726', glow:'rgba(61,214,140,.6)',
        act:'fumble', say:['still learning','what does this button do','level 18 on bandit'] },
      { n:'BLUE HAT',   hat:'#4EA8FF', body:'#142B47', glow:'rgba(78,168,255,.6)',
        act:'scan',   say:['testing before release','bug bounty','found it pre-launch'] }
    ];

    function build(){
      dpr = Math.min(window.devicePixelRatio||1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W*dpr; cv.height = H*dpr;
      cv.style.width = W+'px'; cv.style.height = H+'px';
      g.setTransform(dpr,0,0,dpr,0,0);
      cols = Math.ceil(W/GAP)+1; rows = Math.ceil(H/GAP)+1;

      nodes = [];
      for(var y=0;y<rows;y++) for(var x=0;x<cols;x++)
        nodes.push({x:x*GAP, y:y*GAP, gx:x, gy:y, lit:0});

      packets = [];
      var count = Math.min(13, Math.round((cols*rows)/30));
      for(var i=0;i<count;i++) packets.push(spawnPacket());

      bench.w = Math.min(230, W*0.44);
      bench.x = W*0.5 - bench.w/2;
      bench.y = Math.min(H-70, H*0.80);

      hats = HATS.map(function(h,i){
        var lane = 1 + Math.floor((i+0.5)*(rows-2)/HATS.length);
        var sc = 0.95 + Math.random()*0.4;
        return {
          k:h, state:'bench', t:0,
          x: bench.x + 22 + i*((bench.w-44)/(HATS.length-1)),
          y: bench.y - 11,
          lane: lane*GAP,
          dir: i<3 ? 1 : -1,
          sp: 0.24 + Math.random()*0.24,
          ph: Math.random()*6.283,
          sc: sc, a: 0.44 + sc*0.16,
          leaveAt: 90 + i*46,
          bub:null, bubT:0, nextBub: 400 + (Math.random()*700|0),
          act:0, actT:0, clash:0, target:0, foe:null
        };
      });
      sparks = []; F = 0; nextDuel = 300;
    }

    function spawnPacket(){
      var gx=(Math.random()*cols)|0, gy=(Math.random()*rows)|0;
      var d=[[1,0],[-1,0],[0,1],[0,-1]][(Math.random()*4)|0];
      var kind=Math.random();
      return { gx:gx, gy:gy, dx:d[0], dy:d[1], t:0,
        sp:0.006+Math.random()*0.009,
        col: kind<.12 ? '255,77,109' : (kind<.34 ? '0,240,181' : '124,92,255'),
        trail:[] };
    }

    function say(s, txt, dur){ s.bub = txt; s.bubT = dur||150; }

    /* ── bubble ── */
    function drawBubble(s){
      if(!s.bub || s.bubT<=0) return;
      var fade = Math.min(1, s.bubT/26) * Math.min(1, (150-s.bubT)/12 + 0.35);
      g.save();
      g.globalAlpha = Math.max(0, Math.min(1,fade)) * 0.95;
      g.font = '600 9px "IBM Plex Mono", monospace';
      var tw = g.measureText(s.bub).width;
      var pw = tw+16, phh = 17;
      var bx = s.x - pw/2, by = s.y - 30*s.sc - phh;
      if(bx < 4) bx = 4;
      if(bx + pw > W-4) bx = W-4-pw;

      g.fillStyle='rgba(6,8,13,.92)';
      g.strokeStyle=s.k.hat; g.lineWidth=1;
      g.shadowBlur=8; g.shadowColor=s.k.glow;
      var r=5;
      g.beginPath();
      g.moveTo(bx+r,by); g.lineTo(bx+pw-r,by); g.quadraticCurveTo(bx+pw,by,bx+pw,by+r);
      g.lineTo(bx+pw,by+phh-r); g.quadraticCurveTo(bx+pw,by+phh,bx+pw-r,by+phh);
      g.lineTo(bx+r,by+phh); g.quadraticCurveTo(bx,by+phh,bx,by+phh-r);
      g.lineTo(bx,by+r); g.quadraticCurveTo(bx,by,bx+r,by);
      g.closePath(); g.fill(); g.stroke();
      g.shadowBlur=0;

      var tipx = Math.max(bx+8, Math.min(bx+pw-8, s.x));
      g.beginPath();
      g.moveTo(tipx-4,by+phh); g.lineTo(tipx,by+phh+5); g.lineTo(tipx+4,by+phh);
      g.closePath(); g.fillStyle='rgba(6,8,13,.92)'; g.fill();
      g.strokeStyle=s.k.hat; g.beginPath();
      g.moveTo(tipx-4,by+phh); g.lineTo(tipx,by+phh+5); g.lineTo(tipx+4,by+phh); g.stroke();

      g.fillStyle=s.k.hat; g.textAlign='center'; g.textBaseline='middle';
      g.fillText(s.bub, bx+pw/2, by+phh/2+0.5);
      g.restore();
    }

    /* ── one swordsman ── */
    function drawHat(s){
      var sitting = (s.state==='bench');
      var bob = sitting ? 0 : Math.sin(s.ph)*1.7;
      var lean = 0, swing = 0, extra = 0;

      if(s.state==='act'){
        var pr = 1 - s.actT/70;
        if(s.k.act==='strike'){ lean = Math.sin(pr*3.14)*4; swing = Math.sin(pr*3.14)*2.4; }
        else if(s.k.act==='guard'){ swing = -1.5; }
        else if(s.k.act==='spin'){ extra = pr*6.283; }
        else if(s.k.act==='fumble'){ swing = Math.sin(pr*9)*1.8; lean = Math.sin(pr*6)*2; }
        else if(s.k.act==='shrug'){ bob += Math.sin(pr*6.283)*2; }
      }
      if(s.state==='clash') swing = 3.2;

      g.save();
      g.translate(s.x + lean, s.y + bob);
      if(extra) g.rotate(extra);
      g.scale(s.dir*s.sc, s.sc);
      g.globalAlpha = s.a;

      g.fillStyle='rgba(0,0,0,.30)';
      g.beginPath(); g.ellipse(0, 12-bob, 7.5, 2.2, 0, 0, 6.283); g.fill();

      var sway = Math.sin(s.ph*0.85)*0.9 + s.clash*4 + swing;
      g.strokeStyle=s.k.hat;
      g.shadowBlur=7; g.shadowColor=s.k.glow;
      g.lineWidth=1.5; g.lineCap='round';
      g.beginPath();
      g.moveTo(4.5,2.5);
      g.quadraticCurveTo(11+sway,-2.5, 15.5+sway*0.6, -10+sway);
      g.stroke();
      g.shadowBlur=0;
      g.strokeStyle='rgba(0,0,0,.5)'; g.lineWidth=2.2;
      g.beginPath(); g.moveTo(3.2,3.4); g.lineTo(5.6,1.4); g.stroke();

      g.fillStyle=s.k.body;
      g.beginPath();
      g.moveTo(-5.2,11); g.lineTo(-3.6,-1); g.lineTo(3.6,-1); g.lineTo(5.2,11);
      g.closePath(); g.fill();
      g.strokeStyle='rgba(0,0,0,.45)'; g.lineWidth=0.7; g.stroke();

      g.fillStyle=s.k.body;
      g.beginPath(); g.arc(0,-3.6,3.5,0,6.283); g.fill();

      g.fillStyle=s.k.hat;
      g.beginPath();
      g.moveTo(-8.6,-5.4);
      g.quadraticCurveTo(0,-13.4, 8.6,-5.4);
      g.quadraticCurveTo(0,-3.2, -8.6,-5.4);
      g.closePath(); g.fill();

      g.fillStyle=s.k.hat;
      g.shadowBlur=5; g.shadowColor=s.k.glow;
      g.beginPath(); g.arc(-1.7,-3.1,0.85,0,6.283); g.fill();
      g.beginPath(); g.arc( 1.7,-3.1,0.85,0,6.283); g.fill();
      g.shadowBlur=0;
      g.restore();

      if(s.k.act==='scan' && s.state==='act'){
        var pr2 = 1 - s.actT/70;
        g.save(); g.globalAlpha=(1-pr2)*0.45;
        g.strokeStyle=s.k.hat; g.lineWidth=1;
        g.beginPath(); g.arc(s.x, s.y, 8+pr2*26, 0, 6.283); g.stroke();
        g.restore();
      }
    }

    function drawBench(){
      g.save();
      g.globalAlpha=0.5;
      g.fillStyle='#2A2018';
      g.fillRect(bench.x, bench.y, bench.w, 5);
      g.fillStyle='#1C1610';
      g.fillRect(bench.x+14, bench.y+5, 5, 13);
      g.fillRect(bench.x+bench.w-19, bench.y+5, 5, 13);
      g.strokeStyle='rgba(255,176,32,.22)'; g.lineWidth=1;
      g.strokeRect(bench.x+0.5, bench.y+0.5, bench.w-1, 4);
      g.globalAlpha=0.32;
      g.font='600 8px "IBM Plex Mono", monospace';
      g.fillStyle='#8A97AB'; g.textAlign='center'; g.textBaseline='top';
      g.fillText('THE SIX HATS', bench.x+bench.w/2, bench.y+21);
      g.restore();
    }

    /* ── the duel director ── */
    function startDuel(){
      var free = hats.filter(function(s){ return s.state==='walk' });
      if(free.length < 2) return;
      var i = (Math.random()*free.length)|0;
      var A = free.splice(i,1)[0];
      var j = (Math.random()*free.length)|0;
      var B = free[j];
      var mid = Math.max(90, Math.min(W-90, (A.x+B.x)/2));
      var lane = A.lane;
      A.state='duel'; B.state='duel';
      A.foe=B; B.foe=A;
      A.target=mid-19; B.target=mid+19;
      A.lane=lane; B.lane=lane;
      A.dir=1; B.dir=-1;
      say(A, A.k.say[(Math.random()*A.k.say.length)|0], 130);
      setTimeout(function(){ if(B.state==='duel'||B.state==='clash') say(B, B.k.say[(Math.random()*B.k.say.length)|0],130) }, 700);
    }

    function draw(){
      if(!vis){ requestAnimationFrame(draw); return; }
      F++;
      g.clearRect(0,0,W,H);

      g.strokeStyle='rgba(124,92,255,.045)'; g.lineWidth=1;
      g.beginPath();
      for(var x=0;x<=cols;x++){ g.moveTo(x*GAP,0); g.lineTo(x*GAP,H); }
      for(var y=0;y<=rows;y++){ g.moveTo(0,y*GAP); g.lineTo(W,y*GAP); }
      g.stroke();

      for(var i=0;i<nodes.length;i++){
        var n=nodes[i];
        if(n.lit>0) n.lit-=0.016;
        g.fillStyle='rgba(138,151,171,'+(0.055+Math.max(0,n.lit)*0.7)+')';
        g.beginPath(); g.arc(n.x,n.y, n.lit>0?2.4:1.2, 0, 6.283); g.fill();
      }

      for(var p=0;p<packets.length;p++){
        var k=packets[p];
        k.t+=k.sp;
        if(k.t>=1){
          k.t=0; k.gx+=k.dx; k.gy+=k.dy;
          var ni=k.gy*cols+k.gx;
          if(nodes[ni]) nodes[ni].lit=1;
          if(k.gx<0||k.gx>=cols||k.gy<0||k.gy>=rows){ packets[p]=spawnPacket(); continue; }
          if(Math.random()<.42){
            if(k.dx!==0){ k.dx=0; k.dy=Math.random()<.5?1:-1 }
            else { k.dy=0; k.dx=Math.random()<.5?1:-1 }
          }
        }
        var px=(k.gx+k.dx*k.t)*GAP, py=(k.gy+k.dy*k.t)*GAP;
        k.trail.push([px,py]); if(k.trail.length>16) k.trail.shift();
        for(var t=0;t<k.trail.length;t++){
          var f=t/k.trail.length;
          g.fillStyle='rgba('+k.col+','+(f*f*0.5)+')';
          g.beginPath(); g.arc(k.trail[t][0],k.trail[t][1],1+f*1.6,0,6.283); g.fill();
        }
        g.shadowBlur=10; g.shadowColor='rgba('+k.col+',.85)';
        g.fillStyle='rgba('+k.col+',.95)';
        g.beginPath(); g.arc(px,py,2.4,0,6.283); g.fill();
        g.shadowBlur=0;
      }

      drawBench();

      if(F > nextDuel){ startDuel(); nextDuel = F + 420 + ((Math.random()*260)|0); }

      for(var h=0;h<hats.length;h++){
        var s=hats[h];
        s.clash *= 0.86;
        if(s.bubT>0) s.bubT--;

        if(s.state==='bench'){
          s.t++;
          if(s.t===Math.round(s.leaveAt*0.55)) say(s, s.k.n, 120);
          if(s.t > s.leaveAt){
            s.state='walk'; s.t=0;
            s.dir = s.x < W/2 ? -1 : 1;
          }
        }
        else if(s.state==='walk'){
          s.ph += 0.075;
          s.y += (s.lane - s.y)*0.03;
          s.x += s.dir*s.sp;
          if(s.x<-30) s.x=W+25;
          if(s.x>W+30) s.x=-25;
          if(--s.nextBub<=0){
            say(s, s.k.say[(Math.random()*s.k.say.length)|0], 140);
            s.nextBub = 620 + ((Math.random()*900)|0);
          }
          if(Math.random()<0.0022){ s.state='act'; s.actT=70; }
          if(Math.random()<0.0009) s.dir*=-1;
        }
        else if(s.state==='act'){
          s.ph += 0.03;
          if(--s.actT<=0) s.state='walk';
        }
        else if(s.state==='duel'){
          s.ph += 0.09;
          s.y += (s.lane - s.y)*0.06;
          var dx = s.target - s.x;
          s.x += Math.sign(dx)*Math.min(Math.abs(dx), 1.5);
          if(Math.abs(dx) < 2 && s.foe && Math.abs(s.foe.target - s.foe.x) < 3){
            s.state='clash'; s.t=0;
            if(s.foe.state==='duel'){ s.foe.state='clash'; s.foe.t=0; }
            if(s.dir===1){
              s.clash=1; s.foe.clash=1;
              var mx=(s.x+s.foe.x)/2, my=s.y-7;
              for(var q=0;q<16;q++){
                sparks.push({x:mx,y:my,
                  vx:(Math.random()-0.5)*3.4, vy:(Math.random()-0.95)*2.8,
                  life:1, col:(q%2 ? s.k.hat : s.foe.k.hat)});
              }
            }
          }
        }
        else if(s.state==='clash'){
          s.t++;
          s.ph += 0.22;
          if(s.t%13===0 && s.t<52 && s.dir===1 && s.foe){
            s.clash=1; s.foe.clash=1;
            var mx2=(s.x+s.foe.x)/2, my2=s.y-7;
            for(var q2=0;q2<10;q2++){
              sparks.push({x:mx2,y:my2,
                vx:(Math.random()-0.5)*3, vy:(Math.random()-0.95)*2.4,
                life:1, col:(q2%2 ? s.k.hat : s.foe.k.hat)});
            }
          }
          if(s.t>72){
            s.state='walk'; s.foe=null;
            s.dir *= -1;
            s.nextBub = 300 + ((Math.random()*500)|0);
          }
        }
      }

      for(var h2=0;h2<hats.length;h2++) drawHat(hats[h2]);
      for(var h3=0;h3<hats.length;h3++) drawBubble(hats[h3]);

      for(var q3=sparks.length-1;q3>=0;q3--){
        var sp=sparks[q3];
        sp.x+=sp.vx; sp.y+=sp.vy; sp.vy+=0.09; sp.life-=0.042;
        if(sp.life<=0){ sparks.splice(q3,1); continue; }
        g.globalAlpha=sp.life*0.9;
        g.fillStyle=sp.col;
        g.shadowBlur=7; g.shadowColor=sp.col;
        g.beginPath(); g.arc(sp.x,sp.y,1.6*sp.life,0,6.283); g.fill();
        g.shadowBlur=0; g.globalAlpha=1;
      }

      requestAnimationFrame(draw);
    }

    build(); draw();
    setTimeout(function(){ cv.classList.add('on') }, 120);
    window.addEventListener('resize', build, {passive:true});
    document.addEventListener('visibilitychange', function(){ vis = !document.hidden; });
  })();

  /* ══════ SIDEBAR BOTTOM: stagger in ══════ */
  (function(){
    var links = document.querySelectorAll('#sidebar .sidebar-bottom a, #sidebar .sidebar-bottom .mode-toggle');
    if(!links.length || slow) return;
    links.forEach(function(el,i){
      el.classList.add('cy-sb');
      setTimeout(function(){ el.classList.add('up') }, 420 + i*80);
    });
  })();


});
</script>
